<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Analysis - BizzBoost</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary-accent: #6366F1; /* Indigo */
      --secondary-accent: #8B5CF6; /* Purple */
      --sidebar-bg: #ffffff;
      --main-bg: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border-color: #e5e7eb;
      --chart-color-up: #10B981;
      --chart-color-down: #EF4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: var(--main-bg);
      color: var(--text-dark);
    }
    
    .dashboard-layout {
        display: flex;
    }

    /* ------------------------- */
    /* --- Sidebar (Desktop) --- */
    /* ------------------------- */
    .sidebar {
        width: 260px;
        background-color: var(--sidebar-bg);
        border-right: 1px solid var(--border-color);
        height: 100vh;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        transition: all 0.3s;
    }
    .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
    }
    .sidebar-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-accent), var(--secondary-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }
    .sidebar-logo svg {
        width: 22px; height: 22px;
    }
    .sidebar-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-dark);
    }
    
    .sidebar-nav {
        list-style: none;
        padding: 0;
        margin: 0;
        flex-grow: 1;
    }
    .sidebar-nav-item a {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 0.5rem;
        text-decoration: none;
        color: var(--text-light);
        font-weight: 500;
        margin-bottom: 0.5rem;
        transition: background-color 0.2s, color 0.2s;
    }
    .sidebar-nav-item a:hover {
        background-color: #f3f4f6;
        color: var(--text-dark);
    }
    .sidebar-nav-item a.active {
        background-color: var(--primary-accent);
        color: white;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }
    .sidebar-nav-item svg {
        width: 24px;
        height: 24px;
    }

    /* ---------------------- */
    /* --- Main Content --- */
    /* ---------------------- */
    .main-content {
        flex-grow: 1;
        padding: 2rem;
        margin-left: 260px;
        transition: all 0.3s;
    }
    
    .page-header {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .market-overview-card {
        background-color: var(--card-bg);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .market-value {
        font-size: 2.5rem;
        font-weight: 700;
    }
    .market-growth {
        font-size: 1rem;
        font-weight: 500;
    }
    .market-growth .value {
        font-weight: 600;
    }
    .market-growth.positive .value,
    .market-growth.positive svg {
        color: var(--chart-color-up);
    }
    .market-growth.negative .value,
    .market-growth.negative svg {
        color: var(--chart-color-down);
    }
    .market-growth svg {
        width: 16px; height: 16px; vertical-align: middle; margin-bottom: 2px;
    }

    .metric-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 1rem;
        border-radius: 0.75rem;
        text-align: center;
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.2s;
    }
    .metric-card:hover {
        border-color: var(--primary-accent);
        color: var(--primary-accent);
        transform: translateY(-3px);
    }
    .metric-card.active {
        background-color: var(--primary-accent);
        border-color: var(--primary-accent);
        color: white;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
    }
    .metric-card svg {
        width: 28px; height: 28px; margin-bottom: 0.5rem;
    }
    
    /* --------------------------------- */
    /* --- Mobile & Tablet Overrides --- */
    /* --------------------------------- */
    .bottom-nav { display: none; }

    @media (max-width: 991.98px) {
        .sidebar {
            left: -260px;
        }
        .main-content {
            margin-left: 0;
            padding: 1rem;
            padding-bottom: 80px;
        }
        .page-header { font-size: 1.5rem; }
        .market-value { font-size: 2rem; }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-light);
            font-size: 11px;
            font-weight: 500;
            text-decoration: none;
        }
        .nav-item svg { width: 24px; height: 24px; }
        .nav-item.active { color: var(--primary-accent); }
    }
  </style>
</head>

  <script>
    // --- Chart.js Logic ---
    const ctx = document.getElementById("marketChart").getContext("2d");
    
    // Create a gradient for the chart background fill
    const gradient = ctx.createLinearGradient(0, 0, 0, 200);
    gradient.addColorStop(0, 'rgba(239, 68, 68, 0.3)');
    gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');

    let marketChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"],
        datasets: [{
          label: 'Market Value',
          data: [50, 55, 53, 58, 62, 70, 68, 65, 63, 60.9],
          borderColor: 'var(--chart-color-down)',
          backgroundColor: gradient,
          pointBackgroundColor: "var(--chart-color-down)",
          pointBorderColor: "#fff",
          pointHoverRadius: 6,
          pointRadius: 4,
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { 
          legend: { display: false } 
        },
        scales: {
          y: { 
            beginAtZero: false,
            grid: {
                color: '#e5e7eb',
                borderDash: [3, 3]
            }
          },
          x: {
            grid: {
                display: false
            }
          }
        }
      }
    });
  </script>
