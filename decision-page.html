<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizzBoost - Business Choice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      font-family: 'Segoe UI', sans-serif;
    }

    .choice-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      width: 400px;
      text-align: center;
      color: white;
    }

    .choice-card h2 {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .choice-card p {
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .choice-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      transition: 0.3s;
      margin-bottom: 15px;
    }

    .choice-btn:hover {
      transform: scale(1.05);
    }

    .choice-footer {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.85;
    }

    .choice-footer a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .choice-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="choice-card">
    <img src="logo.png" alt="BizzBoost Logo" style="width:80px; margin-bottom:10px;">
    <h2>BizzBoost</h2>
    <p>Empowering Your Startup Journey</p>

    <h4 class="mb-4">Tell us about yourself</h4>

    <a href="own_business.html" class="btn btn-light text-primary choice-btn">I Own a Business</a>
    <a href="start_business.html" class="btn btn-light text-primary choice-btn">I Need to Start a Business</a>

    <div class="choice-footer">
      <p>If you have already given the details, <a href="home.html">Go Home</a></p>
    </div>
  </div>
</body>
</html>
