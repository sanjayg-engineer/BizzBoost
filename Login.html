<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizzBoost - Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }

    .login-container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      width: 360px;
      text-align: center;
      color: white;
    }

    .logo {
      font-size: 40px;
      margin-bottom: 5px;
          }

    h1 {
      font-size: 28px;
      font-weight: bold;
    }

    p {
      margin-bottom: 25px;
      font-size: 14px;
      opacity: 0.9;
    }

    /* Tabs */
    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border-radius: 12px 12px 0 0;
      transition: background 0.3s;
    }
    .tabs button.active {
      background: white;
      color: #2563eb;
    }

    .input-group {
      position: relative;
      margin-bottom: 15px;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .input-group input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: white;
      color: #2563eb;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #e0e0e0;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: rgba(255,255,255,0.7);
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.4);
    }
    .divider span {
      margin: 0 10px;
      font-size: 12px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .google-btn:hover {
      background: rgba(255,255,255,0.25);
    }
    .google-btn img {
      width: 18px;
    }

    .demo-text {
      margin-top: 15px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo"><img src="logo.png" alt="" style="width: 100px ; height: 100px ;"></div>
    <h1>BizzBoost</h1>
    <p>AI-Assisted Business Strategy</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="active">Login</button>
      <button onclick="window.location.href='signup.html'">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div class="input-group">
      <input type="email" id="email" placeholder="Email">
    </div>
    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button class="btn" id="emailLogin">Sign In</button>

    <div class="divider"><span>or</span></div>

    <div class="google-btn" id="googleLogin">
      <img src="google.png" alt="Google logo"> Continue with Google
    </div>

    <p class="demo-text">Demo: Use any email/password combination</p>
  </div>

  <!-- Firebase SDK (same as your original script) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAtTcIPAK5a8-PKaCxMBT4Ylv3LcnieHIg",
      authDomain: "bizzboost-a0e09.firebaseapp.com",
      projectId: "bizzboost-a0e09",
      storageBucket: "bizzboost-a0e09.appspot.com",
      messagingSenderId: "636727800750",
      appId: "1:636727800750:web:a32cb2eb385112069c4e3f",
      measurementId: "G-W122HECTPV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById("googleLogin").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then(() => window.location.href = "decision-page.html")
        .catch(err => alert("Google Login Failed!"));
    });

    document.getElementById("emailLogin").addEventListener("click", () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      signInWithEmailAndPassword(auth, email, password)
        .then(() => window.location.href = "decision-page.html")
        .catch(error => alert("Login Failed: " + error.message));
    });
  </script>
</body>
</html>
